<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">HelloPT logo</title>
  <desc id="desc">HelloPT logo for dark backgrounds with a blue mark and white wordmark.</desc>
  <defs>
    <linearGradient id="markBlue" x1="32" y1="42" x2="240" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2d8cff"/>
      <stop offset="1" stop-color="#1262ff"/>
    </linearGradient>
    <linearGradient id="tagBlue" x1="336" y1="176" x2="770" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dcefff"/>
