      <stop offset="0" stop-color="#1dbbdd"/>
      <stop offset="0.46" stop-color="#087fac"/>
      <stop offset="1" stop-color="#004768"/>
    </radialGradient>
    <linearGradient id="border" x1="78" y1="34" x2="620" y2="710" gradientUnits="userSpaceOnUse">
