name: Download Netlify deployment ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-netlify-build.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:netlify
      - name: Upload downloadable deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hellopt-homepage-deploy
          path: dist/
          if-no-files-found: error
          retention-days: 14
